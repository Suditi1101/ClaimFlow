global:
  scrape_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: django
  static_configs:
  - targets:
    - web:8000
- job_name: outbox
  static_configs:
  - targets:
    - outbox:9101
- job_name: workers
  static_configs:
  - targets:
    - document:9102
    - policy:9102
    - fraud:9102
    - workflow:9102
    - payment:9102
    - notification:9102
