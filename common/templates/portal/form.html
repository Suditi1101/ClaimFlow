{% extends 'portal/base.html' %}{% block content %}<h1>{{ title }}</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% if owner_setup %}<p><label for="setup-code">One-time setup code</label><input type="password" name="setup_code" id="setup-code" required autocomplete="off"></p>{% endif %}<input type="submit" value="Continue"></form>{% if owner_setup %}<script>const token=new URLSearchParams(location.hash.slice(1)).get('token');if(token){document.getElementById('setup-code').value=token;history.replaceState(null,'',location.pathname);}</script>{% endif %}{% endblock %}
